name: Flutter Build All Platforms

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'GitHub Release tag to create or update, for example v1.2.3'
        required: true
        type: string
  push:
    tags:
      - 'v*'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    uses: ./.github/workflows/flutter-build-windows.yml
    with:
      artifact-name: trusttunnel-windows
      artifact-path: build/windows/x64/runner/Release/**

  build-linux:
    uses: ./.github/workflows/flutter-build-linux.yml
    secrets: inherit
    with:
      artifact-name: trusttunnel-linux
      artifact-path: build/linux/x64/release/bundle/**

  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Prepare TrustTunnelClient Android from source
        run: bash .github/scripts/prepare-trusttunnel-android-source.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run intl_utils:generate
          (cd plugins/vpn_plugin && dart run pigeon --input pigeons/platform_api.dart --dart_out lib/platform_api.g.dart --swift_out ios/Classes/PlatformApi.g.swift)
          (cd plugins/vpn_plugin && dart run pigeon --input pigeons/platform_api.dart --swift_out macos/Classes/PlatformApi.g.swift)

      - name: Build Android APK
        run: flutter build apk --release --no-pub

      - name: Build Android app bundle
        run: flutter build appbundle --release --no-pub

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Prepare TrustTunnelClient Apple from source
        run: bash .github/scripts/prepare-trusttunnel-apple-source.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run intl_utils:generate
          (cd plugins/vpn_plugin && dart run pigeon --input pigeons/platform_api.dart --dart_out lib/platform_api.g.dart --swift_out ios/Classes/PlatformApi.g.swift)
          (cd plugins/vpn_plugin && dart run pigeon --input pigeons/platform_api.dart --swift_out macos/Classes/PlatformApi.g.swift)

      - name: Install iOS pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS without codesign
        run: flutter build ios --release --no-pub --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-ios
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Prepare TrustTunnelClient Apple from source
        run: bash .github/scripts/prepare-trusttunnel-apple-source.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run intl_utils:generate
          (cd plugins/vpn_plugin && dart run pigeon --input pigeons/platform_api.dart --dart_out lib/platform_api.g.dart --swift_out ios/Classes/PlatformApi.g.swift)
          (cd plugins/vpn_plugin && dart run pigeon --input pigeons/platform_api.dart --swift_out macos/Classes/PlatformApi.g.swift)

      - name: Install macOS pods
        run: |
          cd macos
          pod install --repo-update

      - name: Generate Flutter macOS config
        run: flutter build macos --release --no-pub --config-only

      - name: Build macOS without codesign
        run: |
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath build/macos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-macos
          path: build/macos/Build/Products/Release/*.app
          if-no-files-found: error

  create-release:
    needs:
      - build-windows
      - build-linux
      - build-android
      - build-ios
      - build-macos
    runs-on: ubuntu-24.04
    if: ${{ success() && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p release-packages
          for artifact_dir in release-artifacts/*; do
            [ -d "$artifact_dir" ] || continue
            artifact_name="$(basename "$artifact_dir")"
            (cd "$artifact_dir" && zip -r "../../release-packages/${artifact_name}.zip" .)
          done

      - name: Resolve release tag
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="${INPUT_RELEASE_TAG}"
          fi

          case "$release_tag" in
            v*) ;;
            *) echo "Release tag must start with v, for example v1.2.3"; exit 1 ;;
          esac

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "TrustTunnel $RELEASE_TAG" --notes "Automated multi-platform build."
          fi
          gh release upload "$RELEASE_TAG" release-packages/*.zip --repo "$GH_REPO" --clobber
